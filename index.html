<body draggable="false" id="body"
class="min-h-screen flex flex-col container mx-auto p-3 select-none bg-gray-100">
    <!--
        Loading Screening... -->
    <div id="loading-screen"
    class="center fixed flex items-center justify-center inset-0 z-[9999] bg-neutral-950"></div>
    <script type="module" src="web/js/load-screen.js"
    defer></script>
    <!--
        Body: Contents -->
    <header class="">
        <h1 class="text-xl py-5 text-center font-bold lg:text-5xl md:text-5xl">
            MD Previewer<br>
            (Under Construction)
        </h1>
    </header>
    <main id="main-idx" class="flex flex-col flex-1">
        <div id="idx-search" class="relative my-4">
            <input id="article-md-view" type="text" value="README"
                class="w-full px-3 py-2 pr-10 border-4 rounded-lg"
                placeholder="Type the MD document name at here">
            <button type="button" id="article-md-search" aria-label="Search"
                class="absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer">
                <span class="bi bi-search"></span>
            </button>
        </div><hr class="rounded-2 border-2">
        <div class="relative mt-4 border-4 rounded-md border-stone-500 flex flex-col flex-1"
            id="idx-view"><article
            class="markdown-body bg-transparent m-0 p-4 flex-1"
            id="content">
        </article></div>
    </main>
    <footer class="text-center mt-4">
        <p class="font-semibold">
            By:
            <span id="github-username">
                Git-Username
            </span>
        </p>
    </footer>
