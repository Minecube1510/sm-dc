<!DOCTYPE html>
<html lang="id" class=""
data-theme="">
<head>
    <!--
        Head: Metas -->
    <meta charset="UTF-8" name-file="index.html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta description="In-Branch: work-dev" in-branch="work-dev">
    <!-- = -->
    <meta http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <!--
        Head: Basic Styles & Script -->
    <link rel="stylesheet" href="web/css/theme-mode.css">
    <link rel="stylesheet" href="web/css/index-style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!--
        Head: Compings -->
    <title id="title">
        SM-DC
    </title><link rel="icon" type="image/x-icon"
    id="favicon" href="./img/favic/favicon.ico">
    <!--
        Head: Early Styles & Scripts -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css">
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <!--=-->
    <script type="module" src="web/js/set-paging.js"></script>
    <script type="module" src="web/js/index/scripting-index.js"
    defer></script>
    <!--
        Others -->
</head>
<!--
|
!-->
<body draggable="false" id="body"
class="container flex flex-col min-h-screen p-3 mx-auto select-none">
    <!--
        Loading Screening, then just Script... -->
    <div class="fixed inset-0 z-[9999] flex items-center justify-center bg-neutral-950"
        id="loading-screen"></div>
    <script type="module" src="web/js/load-screen.js"
    defer></script>
    <!--
        Body: Contents -->
    <header id="header-idx" class="">
        <h1 class="py-5 text-2xl font-bold text-center md:text-5xl lg:text-5xl">
            MD Previewer<br>
            (Under Development)
    </h1></header>
    <main id="main-idx" class="flex flex-col flex-1">
        <hr class="border-2">
        <div class="grid my-4 gap-y-4"
            id="idx-remocon">
            <div class="grid grid-cols-2 gap-4 text-sm font-semibold"
                id="idx-rc-geartool">
                <div
class="relative flex items-center justify-center gap-2 p-2 text-center rounded-lg size-full into-smooth"
                    id="idx-rcgt-lever">RP | PF</div>
                <div class="flex-none w-full col-span-2 row-start-2 rounded-lg into-smooth"
                    id="idx-rcgt-linav">
                    <input type="text" value="" data-value=""
                        placeholder="Path/Folder/File.formatted"
class="px-3 py-2 font-semibold size-full text-start focus:outline-none"
                        id="idx-rcgt-linav-comp" readonly>
                </div><div
class="relative flex items-center justify-center p-2 text-center rounded-lg size-full group into-smooth"
                    id="idx-rcgt-select">Select \V/</div>
            </div><div
class="relative flex py-2 rounded-lg into-smooth"
                id="idx-rc-search">
                <span class="inline-flex items-center px-3 font-black"
                    data-path-root="/" id="idx-rcsc-root">/</span>
                <div class="absolute flex items-center gap-1"
                    id="idx-rcsc-chips"></div>
                <input class="size-full focus:outline-none"
                    autocomplete="off" aria-label="View" spellcheck="false"
                    type="text" id="idx-rcsc-input" value="" data-value=""
                    placeholder="Type the MD document name at here">
                <button type="button" aria-label="Search"
class="flex items-center justify-center mx-2 border cursor-pointer size-6"
                    id="idx-rcsc-btn" value="">
                </button>
                <div
class="absolute inset-x-0 flex items-center max-w-[98%] gap-1 p-2 mx-auto my-2 rounded-lg z-999 theme-smooth"
                    id="idx-rcsc-result"></div>
            </div>
        </div><hr class="border-2">
        <div
class="relative flex flex-1 my-4 overflow-hidden border-2 rounded-lg bg-gray-950 into-smooth"
            id="idx-view">
            <div class=""
                id="idx-view-loading"></div>
            <article
class="flex-1 p-4 m-0 bg-transparent rounded-lg markdown-body"
                id="idx-view-content"></article>
        </div><hr class="border-2">
    </main>
    <footer id="footer-idx" class="mt-4 text-center">
        <p class="font-semibold">
            By:<span id="github-username">
                Git-Username
    </span></p></footer>
</body>
</html>
