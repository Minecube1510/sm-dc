<!DOCTYPE html>
<html lang="id" class=""
data-theme="">
<head>
    <!--
        Head: Metas -->
    <meta charset="UTF-8" name-file="index.html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta description="In-Branch: work-dev" in-branch="work-dev">
    <!-- = -->
    <meta http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <!--
        Head: Basic Styles & Script -->
    <link rel="stylesheet" href="web/css/theme-mode.css">
    <link rel="stylesheet" href="web/css/index-style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!--
        Head: Compings -->
    <title id="title">
        SM-DC
    </title><link rel="icon" type="image/x-icon"
    id="favicon" href="./img/favic/favicon.ico">
    <!--
        Head: Early Styles & Scripts -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css">
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <!--=-->
    <script type="module" src="web/js/set-paging.js"></script>
    <script type="module" src="web/js/index/scripting-index.js"
    defer></script>
    <!--
        Others -->
</head>
<!--
|
!-->
<body draggable="false" id="body"
class="min-h-screen flex flex-col container mx-auto p-3 select-none">
    <!--
        Loading Screening, then just Script... -->
    <div class="center fixed flex items-center justify-center inset-0 z-[9999] bg-neutral-950"
        id="loading-screen"></div>
    <script type="module" src="web/js/load-screen.js"
    defer></script>
    <!--
        Body: Contents -->
    <header id="header-idx" class="">
        <h1 class="text-xl py-5 text-center font-bold lg:text-5xl md:text-5xl">
            MD Previewer<br>
            (Under Development)
        </h1><hr class="rounded-2 border-2">
    </header>
    <main id="main-idx" class="flex flex-col flex-1 into-smooth">
        <div id="idx-remocon" class="grid gap-y-4 my-4">
            <div class="flex justify-center items-center gap-4 text-sm"
                id="idx-geartool">
                <div id="idx-gt-switch"
                class="inline-block text-center"></div>
                <div id="idx-gt-input" class="flex-1">
                    <input placeholder="Path/Folder/File.formatted" type="text"
                        class="w-full px-3 py-2 text-start focus:outline-none into-smooth"
                        id="idx-gt-input-comp" value="" data-value="">
                </div>
                <div id="idx-gt-select">
                </div>
            </div><div class="relative flex overflow-hidden"
                id="idx-search">
                <span class="inline-flex items-center px-3 font-semibold"
                    id="article-md-root" data-path-root="/">/</span>
                <div class="left-12 top-1/2 -translate-y-1/2 gap-1 z-20"
                    id="src-md-chips"></div>
                <input class="flex-1 px-3 py-2 pr-10" autocomplete="off"
                    type="text" id="article-md-search" aria-label="View"
                    spellcheck="false" value="" data-value=""
                    placeholder="Type the MD document name at here">
                <button class="absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer"
                    type="button" id="article-md-src-btn" aria-label="Search"
                    value=""><span class="bi bi-search" id="article-md-src-icon"></span></button>
                <div class="" id="src-md-res"></div>
            </div>
        </div><hr class="rounded-2 border-2">
        <div class="" id="idx-view"><div class="" id="md-loading-idx"></div><article
            class="markdown-body m-0 p-4 flex-1"
            id="content" title="">
        </article></div>
    </main>
    <footer id="footer-idx" class="text-center mt-4">
        <p class="font-semibold">By:
            <span id="github-username">
                Git-Username
            </span>
        </p>
    </footer>
</body>
</html>
